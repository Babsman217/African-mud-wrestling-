<!DOCTYPE html>
<html lang="en">
<head>

<title>Mud Clash – African Arena Wrestling</title>

<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#0f172a;font-family:'Inter',system-ui,sans-serif;user-select:none;touch-action:none;color:#fff}
#cv{position:absolute;inset:0}
.layer{position:absolute;inset:0;z-index:10;pointer-events:none}
.off{opacity:0;pointer-events:none;transition:opacity .3s}
.on{opacity:1;transition:opacity .3s}
.menu{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(15,23,42,.88);backdrop-filter:blur(8px);text-align:center;padding:20px}
.menu.on{pointer-events:auto}
h1{font-size:clamp(3rem,10vw,6.5rem);line-height:.95;margin:0 0 8px;font-weight:900;text-transform:uppercase;letter-spacing:-.04em;background:linear-gradient(#fde68a,#d97706);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:#fde68acc;letter-spacing:.25em;text-transform:uppercase;font-weight:700;margin:0 0 40px}
button{font-family:inherit;cursor:pointer}
.btn{background:linear-gradient(135deg,#d97706,#b45309);color:#fff;border:1px solid #fcd34d;border-radius:999px;padding:16px 56px;font-size:1.4rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em;box-shadow:0 4px 15px #d9770666;transition:transform .2s}
.btn:hover{transform:translateY(-2px) scale(1.05)}
.btn2{margin-top:14px;background:#0f172acc;color:#fde68a;border:1px solid #fcd34d88;border-radius:999px;padding:12px 40px;font-size:1.05rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;transition:transform .2s,background .2s}
.btn2:hover{transform:scale(1.05);background:#1e293b}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid #ffffff33;cursor:pointer;transition:transform .15s}.sw:hover{transform:scale(1.15)}
.sw.sel{border-color:#fbbf24;box-shadow:0 0 10px #fbbf24}
.chip{padding:6px 12px;border-radius:999px;border:1px solid #ffffff33;background:#0f172a99;color:#e5e7eb;font-weight:700;font-size:.8rem}
.chip.sel{background:#d97706;border-color:#fcd34d;color:#fff}
.cards{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:900px}
.card{width:190px;background:linear-gradient(#1e293bcc,#0f172ae6);border:1px solid #ffffff22;border-radius:16px;padding:16px 10px;color:#fff;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-5px);border-color:#ffffff55}.card.leg{animation:lg 1.2s ease-in-out infinite alternate}@keyframes lg{from{box-shadow:0 0 12px #fbbf2466}to{box-shadow:0 0 34px #fbbf24cc}}
.card b{display:block;font-size:1.1rem}.card i{font-size:2.4rem;font-style:normal;display:block}.card span{font-size:.75rem;color:#9ca3af}.card em{display:block;font-style:normal;color:#fbbf24;font-weight:900;font-size:.7rem;letter-spacing:.12em;margin:2px 0 6px;text-transform:uppercase}
.hud{display:flex;justify-content:space-between;align-items:flex-start;padding:max(20px,env(safe-area-inset-top)) 24px 0;gap:12px}
.hud>div.bar{flex:1;max-width:420px}
.row{display:flex;justify-content:space-between;font-weight:900;margin-bottom:4px}
.row small{color:#d1d5db;font-weight:700}
.track{height:30px;border:2px solid #ffffff22;border-radius:12px;overflow:hidden;background:#00000080;display:flex}
.fill{height:100%;width:100%;transition:width .3s}
.rnd{background:#0f172a99;border:1px solid #f59e0b55;border-radius:999px;padding:8px 22px;color:#fbbf24;font-weight:900;letter-spacing:.15em;text-transform:uppercase;white-space:nowrap}
#ins{position:absolute;left:0;right:0;bottom:max(20px,env(safe-area-inset-bottom));text-align:center;font-size:.85rem;font-weight:700;color:#e5e7eb}
#ins span{background:#0f172a99;padding:10px 20px;border-radius:14px;border:1px solid #ffffff22;display:inline-block}
#ins b{color:#fbbf24}
</style>
</head>
<body>
<div id="cv"></div>

<div class="layer">
  <div id="hud" class="hud off">
    <div class="bar"><div class="row"><span>PLAYER</span><small id="php">100/100</small></div>
      <div class="track"><div id="pbar" class="fill" style="background:linear-gradient(90deg,#16a34a,#4ade80)"></div></div></div>
    <div class="rnd">Round <span id="rnd">1</span></div>
    <div class="bar"><div class="row" style="flex-direction:row-reverse"><span id="oname">OPPONENT</span><small id="ohp">100/100</small></div>
      <div class="track" style="justify-content:flex-end"><div id="obar" class="fill" style="background:linear-gradient(270deg,#dc2626,#f87171)"></div></div></div>
  </div>
  <div id="ins" class="off"><span><b>WASD</b> Move · <b>SPACE</b> Jump · <b>L-CLICK</b> Punch combo · <b>R-CLICK / SHIFT</b> Kick · <b>Kick in air</b> Tornado kick · <b>B</b> Block (time it to parry) · <b>X</b> Special</span></div>
</div>

<div id="main" class="menu on">
  <h1>Mud<br>Clash</h1><p class="sub">African Arena Wrestling</p>
  <button class="btn" onclick="startGame()">Enter Arena</button>
  <button class="btn2" onclick="openCust()">Customize Fighter</button>
  <button class="btn2" onclick="showUI('help')">How to Play</button>
  <button class="btn2" id="bloodbtn" onclick="toggleBlood()">Blood: On</button>
</div>
<div id="upg" class="menu off">
  <h2 style="font-size:3rem;margin:0 0 6px;font-weight:900;text-transform:uppercase;font-style:italic">Victory!</h2>
  <p class="sub" style="margin-bottom:30px">Select an upgrade</p>
  <div class="cards">
    <button class="card" onclick="applyUpgrade('health')"><i>❤️</i><b>Vitality</b><span>+30 max health, heal full</span></button>
    <button class="card" onclick="applyUpgrade('speed')"><i>⚡</i><b>Agility</b><span>Move faster</span></button>
    <button class="card" onclick="applyUpgrade('damage')"><i>💪</i><b>Power</b><span>More damage</span></button>
    <button class="card" onclick="applyUpgrade('jump')"><i>🦘</i><b>Legs</b><span>Jump higher</span></button>
    <button class="card" onclick="applyUpgrade('knockback')"><i>💥</i><b>Force</b><span>More knockback</span></button>
  </div>
</div>
<div id="over" class="menu off" style="background:rgba(127,29,29,.9)">
  <h2 style="font-size:4rem;margin:0 0 10px;font-weight:900;text-transform:uppercase">Defeated</h2>
  <p id="overtxt" style="color:#d1d5db;font-size:1.2rem;margin:0 0 36px"></p>
  <button class="btn" style="font-size:1.1rem" onclick="resetToMain()">Try Again</button>
</div>

<script>
// ---------- Audio ----------
const Audio$={ctx:null,
 init(){if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume();},
 tone(type,f0,f1,dur,vol,lp){if(!this.ctx)return;const c=this.ctx,t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.01,t+dur);let n=o;if(lp){const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;o.connect(f);n=f;}n.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur);},
 squish(){this.tone('triangle',150,40,.15,.3,800)},
 hit(){this.tone('sine',100,10,.3,1)},
 whoosh(){this.tone('sawtooth',600,120,.18,.08,1200)}
};

// ---------- State ----------
let scene,camera,renderer,player,opponent,arena;
const clock=new THREE.Clock();
let gameState='menu',round=1,particles=[];
const ARENA=21,FRICTION=.85,BASE_Y=-.45;
let pS={speed:8,push:25,kb:1,jump:12,max:100,hp:100};
let oS={speed:6,push:15,kb:1,max:100,hp:100};
const CD={punch:.4,kick:.8};
const keys={w:0,a:0,s:0,d:0,arrowup:0,arrowdown:0,arrowleft:0,arrowright:0};

window.onload=()=>{document.addEventListener('contextmenu',e=>e.preventDefault());init();initUI();controls();animate();};

function init(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0xd48b55);scene.fog=new THREE.FogExp2(0xd48b55,.006);
 camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,1000);camera.position.set(0,18,14);
 renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
 document.getElementById('cv').appendChild(renderer.domElement);
 scene.add(new THREE.AmbientLight(0xffe4ce,.6));
 const sp=new THREE.SpotLight(0xff9933,3);sp.position.set(20,34,-14);sp.angle=Math.PI/3;sp.penumbra=.5;sp.castShadow=true;
 sp.shadow.mapSize.set(2048,2048);sp.shadow.camera.near=10;sp.shadow.camera.far=100;sp.shadow.bias=-.001;scene.add(sp);
 const fl=new THREE.DirectionalLight(0x665577,.8);fl.position.set(-10,10,-10);scene.add(fl);
 buildEnv2();
 player=createWrestler(0x3a2216,0xcfc3a8,{});scene.add(player);
 opponent=createWrestler(0x7a4d2b,0x9c3b2e,{bald:true,beard:true});scene.add(opponent);menuPose();applyCust();
 addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
}

function buildEnv(){
 const M=(c,r=1)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
 const g=new THREE.Mesh(new THREE.PlaneGeometry(100,100),M(0x966f42));g.rotation.x=-Math.PI/2;g.position.y=-.5;g.receiveShadow=true;scene.add(g);
 const bg=new THREE.CylinderGeometry(1.5,1.5,2,8),rg=new THREE.ConeGeometry(2.2,1.5,8),bm=M(0x8b7355),rm=M(0x4a3c2c,.9);
 [[-9,-9],[9,-10],[-11,7],[11,9],[0,-13],[0,13]].forEach(([x,z])=>{
  const b=new THREE.Mesh(bg,bm);b.position.set(x,.5,z);b.castShadow=b.receiveShadow=true;
  const r=new THREE.Mesh(rg,rm);r.position.set(x,2.25,z);r.castShadow=true;scene.add(b,r);});
 const tg=new THREE.CylinderGeometry(.2,.3,3,5),lg=new THREE.DodecahedronGeometry(1.8),tm=M(0x4a3b2c),lm=M(0x3d5c2e,.8);
 [[-7,-13],[13,-4],[-13,1],[7,13]].forEach(([x,z])=>{
  const t=new THREE.Mesh(tg,tm);t.position.set(x,1,z);t.castShadow=true;
  const l=new THREE.Mesh(lg,lm);l.position.set(x,2.8,z);l.scale.set(1.5,.4,1.5);l.castShadow=true;scene.add(t,l);});
 arena=new THREE.Mesh(new THREE.CylinderGeometry(ARENA,ARENA,.2,32),M(0x3a2318,.9));arena.position.y=-.1;arena.receiveShadow=true;scene.add(arena);
}

// ---------- Wrestler rig ----------
function createBirds(){
 const g=new THREE.Group(),bm=new THREE.MeshStandardMaterial({color:0xffdd00}),wm=new THREE.MeshStandardMaterial({color:0xffffff});
 for(let i=0;i<3;i++){const b=new THREE.Group();
  b.add(new THREE.Mesh(new THREE.BoxGeometry(.15,.15,.25),bm));
  const w1=new THREE.Mesh(new THREE.BoxGeometry(.3,.05,.15),wm);w1.position.x=.15;
  const w2=new THREE.Mesh(new THREE.BoxGeometry(.3,.05,.15),wm);w2.position.x=-.15;b.add(w1,w2);
  const p=new THREE.Group();b.position.x=.6;p.rotation.y=i*Math.PI*2/3;p.add(b);g.add(p);}
 return g;
}

function createWrestler(skin,cloth,opt){
 const M=(c,r=.8,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:r},o));
 const sk=new THREE.Color(skin);
 const skinM=M(skin,.5),darkM=M(sk.clone().multiplyScalar(.55).getHex(),.7),lightM=M(sk.clone().multiplyScalar(1.7).getHex(),.6),
  clothM=M(cloth,1,{side:THREE.DoubleSide}),bandM=M(cloth,1,{side:THREE.DoubleSide}),ragM=M(0xb9ab8c,1),mudM=M(0x2a180f,1),hairM=M(0x120a06,1),ropeM=M(0x8a6b3f,1),
  whiteM=M(0xeeeeee,.4),patchM=M(0x5b6b4a,1);
 const root=new THREE.Group(),mg=new THREE.Group(),body=new THREE.Group(),torso=new THREE.Group();
 mg.position.y=BASE_Y;body.position.y=1.15;mg.add(body);root.add(mg);body.add(torso);
 const add=(p,geo,m,x=0,y=0,z=0)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;p.add(o);return o;};
 const Cy=(a,b,h,s=10,open)=>new THREE.CylinderGeometry(a,b,h,s,1,open),Bx=(x,y,z)=>new THREE.BoxGeometry(x,y,z),Sp=r=>new THREE.SphereGeometry(r,12,10);

 // lean, tapered torso with ribs and a scar
 add(torso,Cy(.34,.24,.85),skinM,0,.42,0).scale.z=.65;
 for(let i=0;i<4;i++){add(torso,Bx(.3-i*.02,.018,.02),darkM,0,.38+i*.09,.205);}
 const scar=add(torso,Bx(.24,.025,.02),lightM,-.08,.62,.2);scar.rotation.z=.6;
 add(torso,Bx(.02,.3,.02),darkM,0,.45,.2);
 // dirt/mud splatters
 for(let i=0;i<7;i++){const m=add(torso,Bx(.05+Math.random()*.08,.04+Math.random()*.06,.02),mudM,(Math.random()-.5)*.5,.15+Math.random()*.6,.19);m.castShadow=false;}

 // ragged shorts, rope belt, patch, hanging strips
 add(body,Cy(.3,.34,.5,10,true),clothM,0,-.15,0).scale.z=.7;
 const belt=add(body,new THREE.TorusGeometry(.26,.03,6,14),ropeM,0,.1,0);belt.rotation.x=Math.PI/2;belt.scale.y=.7;
 add(body,Bx(.14,.14,.02),patchM,.12,-.12,.225);
 [-.18,0,.17].forEach((x,i)=>{const r=add(body,Bx(.11,.2+i%2*.1,.02),clothM,x,-.5,.22);r.rotation.z=(i-1)*.12;});
 [-.1,.12].forEach(x=>{add(body,Bx(.12,.22,.02),clothM,x,-.47,-.22);});
 for(let i=0;i<3;i++)add(body,Bx(.06+Math.random()*.05,.05,.02),mudM,(Math.random()-.5)*.5,-.35+Math.random()*.2,.225).castShadow=false;

 // neck + head
 add(torso,Cy(.09,.1,.15),skinM,0,.9,0);
 const head=new THREE.Group();head.position.set(0,.98,0);torso.add(head);
 add(head,Sp(.2),skinM,0,.17,0).scale.set(1,1.1,.95);
 if(!opt.bald){const h=add(head,new THREE.SphereGeometry(.21,12,8,0,Math.PI*2,0,Math.PI*.5),hairM,0,.2,-.01);h.scale.set(1,1,1);}
 if(opt.beard)add(head,Bx(.22,.1,.1),hairM,0,.04,.11);
 const hb=add(head,new THREE.TorusGeometry(.2,.028,6,14),bandM,0,.23,0);hb.rotation.x=Math.PI/2;
 const t1=add(head,Bx(.05,.3,.015),bandM,-.05,.12,-.22);t1.rotation.set(.2,0,.15);
 const t2=add(head,Bx(.05,.24,.015),bandM,.06,.1,-.22);t2.rotation.set(.2,0,-.2);
 [-.075,.075].forEach(x=>{add(head,Bx(.06,.03,.02),whiteM,x,.18,.185);add(head,Bx(.025,.03,.02),hairM,x,.18,.195);
  const br=add(head,Bx(.09,.02,.02),hairM,x,.235,.19);br.rotation.z=x>0?-.2:.2;});
 add(head,Bx(.04,.07,.04),darkM,0,.1,.195);add(head,Bx(.1,.016,.02),darkM,0,.04,.19);

 // arms: shoulder -> elbow -> wrapped fist
 const sh=[],el=[],hp=[],kn=[];
 [1,-1].forEach((side,i)=>{
  const s=new THREE.Group();s.position.set(side*.42,.72,0);s.rotation.order='YXZ';torso.add(s);
  add(s,Sp(.105),skinM);add(s,Cy(.085,.07,.4),skinM,0,-.2,0);
  const e=new THREE.Group();e.position.y=-.4;s.add(e);
  add(e,Cy(.07,.06,.38),skinM,0,-.19,0);add(e,Cy(.078,.078,.16,8),ragM,0,-.3,0);add(e,Sp(.09),ragM,0,-.43,0);
  add(e,Bx(.02,.12,.02),mudM,.06,-.1,0).castShadow=false;
  sh[i]=s;el[i]=e;
  // legs: hip -> knee -> wrapped foot
  const h=new THREE.Group();h.position.set(side*.17,-.02,0);h.rotation.order='YXZ';body.add(h);
  add(h,Cy(.125,.09,.55),skinM,0,-.275,0);
  const k=new THREE.Group();k.position.y=-.55;h.add(k);
  add(k,Sp(.09),skinM);add(k,Cy(.085,.065,.55),skinM,0,-.275,0);
  add(k,Cy(.085,.085,.14,8),ragM,0,-.5,0);add(k,Bx(.15,.08,.3),ragM,0,-.58,.07);
  add(k,Bx(.1,.06,.02),mudM,0,-.2,.08).castShadow=false;
  hp[i]=h;kn[i]=k;
 });
 const birds=createBirds();birds.position.y=1.5;birds.visible=false;torso.add(birds);
 root.userData={velocity:new THREE.Vector3(),cooldowns:{punch:-9,kick:-9},anim:{type:'none',timer:0,duration:.3,variant:0,hand:0},
  j:{mg,body,torso,head,sh,el,hp,kn},mats:{skinM,darkM,clothM,bandM},stepTimer:0,isStunned:false,stunTimer:0,performedJumpKick:false,jumpKickHit:false,birds,flinch:0,nextHand:0};
 return root;
}

// ---------- Particles ----------
const mudMat=new THREE.MeshStandardMaterial({color:0x2d1a11,roughness:1}),mudGeo=new THREE.BoxGeometry(.15,.15,.15);
function spawn(pos,n,k=1,yOff=0){
 for(let i=0;i<n;i++){
  if(particles.length>80){scene.remove(particles.shift().mesh);}
  const m=new THREE.Mesh(mudGeo,mudMat);m.position.copy(pos);m.position.y+=yOff+Math.random()*.5;scene.add(m);
  particles.push({mesh:m,vel:new THREE.Vector3((Math.random()-.5)*5*k,(Math.random()*5+2)*k,(Math.random()-.5)*5*k),life:1});
 }
}
function updateParticles(dt){
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];
  p.vel.y-=15*dt;p.mesh.position.addScaledVector(p.vel,dt);p.mesh.rotation.x+=p.vel.z*dt;p.mesh.rotation.y+=p.vel.x*dt;p.life-=dt*1.5;
  if(p.mesh.position.y<.3||p.life<=0){scene.remove(p.mesh);particles.splice(i,1);}}
}

// ---------- Combat FX ----------
let hitStop=0;const fx=[];
const trailGeo=new THREE.SphereGeometry(.17,8,6),ringGeo=new THREE.RingGeometry(.3,.45,28);
const addMat=(c,o)=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
function trail(ch,type,i){
 const j=ch.userData.j;ch.updateMatrixWorld(true);
 const hand=type==='punch',p=(hand?j.el[i]:j.kn[1]).localToWorld(hand?new THREE.Vector3(0,-.43,0):new THREE.Vector3(0,-.58,.07));
 const col=ch.userData.fxCol||(hand?0xffb020:type==='kick'?0xff4020:0x40e0ff);
 const m=new THREE.Mesh(trailGeo,addMat(col,.8));m.position.copy(p);m.scale.setScalar(hand?1:1.5);scene.add(m);
 fx.push({m,life:.28,max:.28,k:'t'});
}
function impact(pos,force,sk,col){
 const c=pos.clone();c.y+=1.1;
 const f=new THREE.Mesh(trailGeo,addMat(col?new THREE.Color(col).lerp(new THREE.Color(0xffffff),.7).getHex():0xffffff,1));f.position.copy(c);f.scale.setScalar(2+sk*2);scene.add(f);fx.push({m:f,life:.12,max:.12,k:'f'});
 for(let n=0;n<2;n++){const r=new THREE.Mesh(ringGeo,addMat(col?(n?new THREE.Color(col).lerp(new THREE.Color(0xffffff),.55).getHex():col):(n?0xffd060:0xff6030),.9));r.position.copy(c);scene.add(r);fx.push({m:r,life:.3+n*.1,max:.3+n*.1,k:'r',s:3+sk*3});}
 hitStop=Math.min(.12,force*.003);camera.fov=40+sk*5;crowdHype=Math.min(1,crowdHype+.4+force*.003);if(force>=60)cheer();
}
function updateFx(dt){updateShots(dt);updateFloats(dt);
 for(let i=fx.length-1;i>=0;i--){const e=fx[i];e.life-=dt;const k=Math.max(0,e.life/e.max);
  if(e.life<=0){scene.remove(e.m);e.m.material.dispose();fx.splice(i,1);continue;}
  e.m.material.opacity=k;
  if(e.k==='t')e.m.scale.multiplyScalar(1-dt*5);
  else if(e.k==='f')e.m.scale.multiplyScalar(1+dt*6);
  else{e.m.scale.setScalar(1+(1-k)*e.s);e.m.lookAt(camera.position);}
 }
}

// ---------- Pop-culture upgrades ----------
let pU={fire:0,crit:0,regen:0,dodge:0,finish:0,snap:0,snapLeft:0,finished:0,slow:1,size:1,saiyan:0},aura=null,hpTick=0,fireCd=0;const shots=[];
const POOL=[
 {i:'🔥',n:'Hadouken!',s:'Street Fighter · press F to throw a mud fireball',f(){pU.fire++;}},
 {i:'🥊',n:'Rocky Montage',s:'Eye of the Tiger · +40 max HP and +1 speed',f(){pS.max+=40;pS.speed+=1;pU.rocky=1;}},
 {i:'🕶️',n:'Bullet Time',s:'The Matrix · opponent moves and attacks 15% slower',f(){pU.slow*=.85;}},

     g.ty=-tw*(.7*w)+tw*.9*s*-1*-1;g.ty=tw*(-.7*w+.9*s);g.by=tw*(-.25*w+.35*s);
    }else{ // uppercut
     g.sh[i][0]=m(g.sh[i][0],-.15,-2.5);g.sh[i][2]=0;g.el[i]=m(g.el[i],-1.4,-1.0);
     g.cr=-.22*w+.1*s;g.kn[0]=m(g.kn[0],1.1,.15);g.kn[1]=m(g.kn[1],1.1,.15);
     g.tx=.2*w-.35*s;g.ty=tw*.4*s;
    }
   }else if(a.type==='kick'){ // roundhouse
    g.hp[1][0]=m(g.hp[1][0],-1.3,-1.55);g.hp[1][1]=m(0,-.9,.6);g.kn[1]=m(g.kn[1],2.1,.05);
    g.by=-.5*w+.85*s;g.tx=-.3*s;g.cr=-.05*w;
    g.kn[0]=m(g.kn[0],.8,.4);g.hp[0][0]=m(g.hp[0][0],-.2,-.1);
    g.sh[0][0]=m(g.sh[0][0],-.4,-.3);g.sh[0][2]=m(g.sh[0][2],.7,1.1);g.sh[1][0]=m(g.sh[1][0],-.4,-.3);g.sh[1][2]=m(g.sh[1][2],-.7,-1.1);
    g.el[0]=-.5;g.el[1]=-.5;
   }else{ // tornado jump kick
    const e=Math.min(1,t*4)*(t>.8?(1-t)*5:1);
    g.by=t*Math.PI*2;g.tx=-.4*e;
    g.hp[1][0]=g.hp[1][0]+(-1.6-g.hp[1][0])*e;g.kn[1]=g.kn[1]*(1-e)+.05*e;
    g.hp[0][0]=g.hp[0][0]+(-.5-g.hp[0][0])*e;g.kn[0]=g.kn[0]*(1-e)+1.5*e;
    g.sh[0]=[-.3,0,1.3*e];g.sh[1]=[-.3,0,-1.3*e];g.el[0]=-.4;g.el[1]=-.4;
   }
  }
 }
 if(ch===player&&blocking){g.sh[0]=[-1.5,.3,-.5];g.sh[1]=[-1.5,-.3,.5];g.el[0]=-2.3;g.el[1]=-2.3;g.tx=.15;}
 if(ch===player&&kCharging){g.sh[0]=[-1.2,.5,-.3];g.sh[1]=[-1.2,-.5,.3];g.el[0]=-1;g.el[1]=-1;g.cr=-.1;g.kn[0]=.9;g.kn[1]=.9;}
 if(ch===player&&heating&&pU.heatv&&!heatLock){g.hx=.12;g.tx-=.1;}
 if(ch===player&&ch.userData.vilS){g.sh[0]=[-3,0,-.1];g.sh[1]=[-3,0,.1];g.el[0]=-.1;g.el[1]=-.1;g.tx=1;g.hp[0][0]=.4;g.hp[1][0]=.5;g.kn[0]=.2;g.kn[1]=.2;}
 // hit reaction
 const f=d.flinch;
 if(f>0){g.tx-=.7*f;g.hx-=.6*f;g.sh[0][2]+=.6*f;g.sh[1][2]-=.6*f;g.by+=Math.sin(T*40)*.08*f;}
 smoothPose(d,g,dt,a.type!=='none');
 // apply
 j.body.position.y=1.15+g.cr+(walk?Math.abs(sw)*.05:0);j.body.rotation.y=g.by;
 j.torso.rotation.set(g.tx,g.ty,g.tz);j.head.rotation.set(g.hx,-g.ty*.6,0);
 for(let i=0;i<2;i++){
  j.sh[i].rotation.set(g.sh[i][0],g.sh[i][1],g.sh[i][2]);{const bw=(ch===player&&pU.hulk)?1.35:1,st=g.st[i],sx=bw/Math.sqrt(st);j.sh[i].scale.set(sx,st,sx);}j.el[i].rotation.x=g.el[i];
  j.hp[i].rotation.set(g.hp[i][0],g.hp[i][1],g.hp[i][2]);j.hp[i].scale.y=(i===1?g.stl:1);j.kn[i].rotation.x=g.kn[i];
 }
}

function updatePhysics(dt){
 if(gameState!=='playing'&&gameState!=='ko')return;
 if(pU.regen&&pS.hp<pS.max){pS.hp=Math.min(pS.max,pS.hp+pU.regen*dt);hpTick+=dt;if(hpTick>.2){hpTick=0;updateHealthUI();}}
 let mx=0,mz=0,moving=false;
 if(!player.userData.isStunned){
  if(keys.w||keys.arrowup)mz--;if(keys.s||keys.arrowdown)mz++;if(keys.a||keys.arrowleft)mx--;if(keys.d||keys.arrowright)mx++;
 }
 const fwd=new THREE.Vector3().subVectors(opponent.position,player.position);fwd.y=0;
 if(fwd.lengthSq()<.001)fwd.set(0,0,1);fwd.normalize();
 const right=new THREE.Vector3().crossVectors(fwd,new THREE.Vector3(0,1,0)).normalize();
 if(mx||mz){
  const dir=new THREE.Vector3().addScaledVector(fwd,-mz).addScaledVector(right,mx).normalize();
  player.userData.velocity.x+=dir.x*pS.speed*dt*(blocking?5:11);player.userData.velocity.z+=dir.z*pS.speed*dt*(blocking?5:11);moving=true;
 }
 let diff=Math.atan2(fwd.x,fwd.z)-player.rotation.y;
 while(diff<-Math.PI)diff+=Math.PI*2;while(diff>Math.PI)diff-=Math.PI*2;
 player.rotation.y+=diff*12*dt;
 if(moving&&player.userData.velocity.lengthSq()>1){
  player.userData.stepTimer-=dt;
  if(player.userData.stepTimer<=0){Audio$.squish();spawn(player.position,2,.5);player.userData.stepTimer=.35;}
 }
 // AI
 const od=opponent.userData;
 if(od.freeze>0){od.freeze-=dt;od.velocity.x*=.5;od.velocity.z*=.5;}
 if(gameState==='playing'&&!od.isStunned&&!(od.freeze>0)){
  const dist=opponent.position.distanceTo(player.position),ad=new THREE.Vector3().subVectors(player.position,opponent.position);ad.y=0;ad.normalize();
  const lowHp=oS.hp<oS.max*.3&&od.style!=='boss'&&!player.userData.isStunned,nowT=clock.getElapsedTime();
  if(!od.circT||nowT>od.circT){od.circT=nowT+1.2+Math.random()*1.5;od.circ=Math.random()<.5?-1:1;}
  // dodge: sidestep when the player swings at close range (gets more likely each round)
  if(player.userData.anim.type!=='none'&&dist<3&&Math.random()<Math.min(.5,.12+round*.03)*dt*8){
   const sd=new THREE.Vector3(-ad.z,0,ad.x).multiplyScalar(Math.random()<.5?1:-1);od.velocity.addScaledVector(sd,6+round*.5);}
  // special attacks per opponent type
  if(od.windup>0){od.windup-=dt;od.velocity.x*=.6;od.velocity.z*=.6;opponent.rotation.y=Math.atan2(ad.x,ad.z);
   if(od.windup<=0){tint(opponent,0);if(dist<2.8){opponent.userData.fxCol=0x38bdf8;applyHit(player,opponent,oS.push*2.2);player.userData.velocity.y=9;floatText(player.position,'SLAM!','#fb923c',1.6);}}}
  else if(nowT>(od.spT||0)){
   if(od.style==='grappler'&&dist<2.8){od.windup=.6;od.spT=nowT+5;tint(opponent,0x882200);floatText(opponent.position,'⚠️ GRAB!','#fca5a5',1.4);}
   else if(od.style==='speed'&&dist>3&&dist<9){od.velocity.addScaledVector(ad,26);od.spT=nowT+3;}
   else if(od.style==='boss'&&dist<9){od.velocity.y=16;od.pound=1;od.spT=nowT+6;floatText(opponent.position,'⚠️ GROUND POUND!','#fca5a5',1.5);}
  }
  if(od.windup>0){}else if(lowHp&&dist<10){
   // low health: run away, zig-zag, avoid the arena edge, only fight back when cornered
   if(od.fledR!==round){od.fledR=round;floatText(opponent.position,'😰 RETREAT!','#93c5fd',1.3);}
   const er=Math.hypot(opponent.position.x,opponent.position.z),away=ad.clone().multiplyScalar(-1);
   away.addScaledVector(new THREE.Vector3(-away.z,0,away.x).multiplyScalar(od.circ),.6);
   if(er>ARENA*.65)away.addScaledVector(new THREE.Vector3(-opponent.position.x,0,-opponent.position.z).normalize(),er>ARENA*.85?2.5:1);
   away.normalize();
   od.velocity.x+=away.x*oS.speed*dt*7*(od.muddy>0?.65:1);od.velocity.z+=away.z*oS.speed*dt*7*(od.muddy>0?.65:1);
   let df=Math.atan2(away.x,away.z)-opponent.rotation.y;while(df<-Math.PI)df+=Math.PI*2;while(df>Math.PI)df-=Math.PI*2;opponent.rotation.y+=df*10*dt;
   if(od.velocity.lengthSq()>1){od.stepTimer-=dt;if(od.stepTimer<=0){spawn(opponent.position,1,.3);od.stepTimer=.3;}}
   if(dist<2.2&&er>ARENA*.8&&Math.random()<3*dt){opponent.rotation.y=Math.atan2(ad.x,ad.z);attack(opponent,player,Math.random()<.5?'kick':'punch');}
  }else if(dist>1.8){
   od.velocity.x+=ad.x*oS.speed*dt*6*(od.muddy>0?.65:1);od.velocity.z+=ad.z*oS.speed*dt*6*(od.muddy>0?.65:1);
   let df=Math.atan2(ad.x,ad.z)-opponent.rotation.y;while(df<-Math.PI)df+=Math.PI*2;while(df>Math.PI)df-=Math.PI*2;
   opponent.rotation.y+=df*8*dt;
   if(od.velocity.lengthSq()>1){od.stepTimer-=dt;if(od.stepTimer<=0){spawn(opponent.position,1,.3);od.stepTimer=.4;}}
  }else{
   opponent.rotation.y=Math.atan2(ad.x,ad.z);
   if(Math.random()<2*pU.slow*dt)attack(opponent,player,Math.random()<.3?'kick':'punch');
  }
 }
 {const sd=new THREE.Vector3().subVectors(player.position,opponent.position);sd.y=0;const sl=sd.length();
  if(sl<.9){if(sl<.001)sd.set(0,0,1);else sd.divideScalar(sl);const ps=(.9-sl)/2;player.position.addScaledVector(sd,ps);opponent.position.addScaledVector(sd,-ps);}}
 // physics
 [player,opponent].forEach(c=>{
  const d=c.userData,v=d.velocity,p=c.position;
  p.addScaledVector(v,dt);
  const fr=patchFric(c);v.x*=Math.pow(fr,dt*60);v.z*=Math.pow(fr,dt*60);v.y-=25*dt;
  if(p.y<.5){if(c===opponent&&d.pound&&v.y<-2){d.pound=0;groundPound();}if(c===player&&d.vilDive&&v.y<-2){d.vilDive=0;d.vilS=0;p.y=.5;vilSlam();}p.y=.5;v.y=0;
   if(d.performedJumpKick){if(!d.jumpKickHit&&!(c===player&&pU.jackie)){d.isStunned=true;d.stunTimer=2.5;d.birds.visible=true;}d.performedJumpKick=false;d.jumpKickHit=false;}}
  if(d.isStunned){
   d.stunTimer-=dt;d.birds.rotation.y+=4*dt;
   d.birds.children.forEach(pv=>{const b=pv.children[0];b.position.y=Math.sin(clock.getElapsedTime()*10+pv.rotation.y)*.1;
    b.children[1].rotation.z=Math.sin(clock.getElapsedTime()*30)*.5;b.children[2].rotation.z=-Math.sin(clock.getElapsedTime()*30)*.5;});
   if(d.stunTimer<=0){d.isStunned=false;d.birds.visible=false;}
  }
  const r=Math.hypot(p.x,p.z);
  if(r>ARENA){const an=Math.atan2(p.z,p.x);p.x=Math.cos(an)*ARENA;p.z=Math.sin(an)*ARENA;v.x*=-.5;v.z*=-.5;}
 });
 pose(player,dt);pose(opponent,dt);
}

function animate(){
 requestAnimationFrame(animate);
 let dt=Math.min(clock.getDelta(),.1);const rdt=dt;
 if(hitStop>0){hitStop-=dt;dt*=.08;}
 camera.fov+=(40-camera.fov)*Math.min(1,dt*8+.02);camera.updateProjectionMatrix();
 if(gameState==='menu'){
  const t=Date.now()*.0005;camera.position.set(Math.cos(t)*12,6,Math.sin(t)*12);camera.lookAt(0,1,0);
  pose(player,dt);pose(opponent,dt);
 }else if(gameState==='custom'){
  custAng+=custDrag?0:rdt*.5;
  camera.position.set(Math.sin(custAng)*5.2,1.7,Math.cos(custAng)*5.2);camera.lookAt(0,1.2,0);
  pose(player,dt);
 }else if(gameState==='replay'){updateReplay(rdt);}else if(gameState==='playing'||gameState==='gameover'||gameState==='ko'){
  const dp=new THREE.Vector3().subVectors(player.position,opponent.position);dp.y=0;
  const sep=dp.length();if(sep>1.6){let df=Math.atan2(dp.x,dp.z)-camAng;while(df<-Math.PI)df+=Math.PI*2;while(df>Math.PI)df-=Math.PI*2;camAng+=df*Math.min(1,dt*(sep>3?6:2));}dp.set(Math.sin(camAng),0,Math.cos(camAng));
  const ideal=player.position.clone().addScaledVector(dp,15);ideal.y+=9;
  camera.position.lerp(ideal,.12);
  const lt=player.position.clone().lerp(opponent.position,.5);lt.y+=1;
  const cl=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion).add(camera.position);
  cl.lerp(lt,.15);camera.lookAt(cl);
 }
 updatePhysics(dt);const fdt=(gameState==='replay'&&replay)?dt*replay.sp:dt;updateParticles(fdt);updateFx(fdt);updateEnv(rdt);if(gameState==='playing'||gameState==='ko')recFrame(dt);
 renderer.render(scene,camera);
}
